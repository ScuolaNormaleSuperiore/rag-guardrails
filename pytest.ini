[pytest]
# Not a .py file on purpose: the Cat imports every .py it finds in the plugin
# folder, so pytest configuration must not be one of them. The tests live in a
# hidden folder, .tests/, for the same reason: `glob` does not enter it.
testpaths = .tests
# pytest skips directories that start with a dot unless told otherwise, so
# without this line `pytest .` would collect no test at all. `.*` is left out
# of the list on purpose; the folders that hold no tests are named instead.
norecursedirs = .git .githooks .github .claude .tools DEV DOC dist __pycache__ *.egg
# Two entries on purpose: "." makes `checks` and `rag_guardrails`
# importable, "/app" makes the core importable when running inside the
# container. A path that does not exist is ignored, so the same file works on a
# developer machine, where /app is absent. Without the second entry
# .tests/integration/test_hooks.py is skipped instead of failing, which reads
# as a success.
pythonpath = . /app
# The cache provider is off for every entry point, not just one. The plugin
# folder is bind-mounted into the container, so .pytest_cache is written by
# whichever side runs first and is then unwritable by the other — the warning
# appeared locally and in the container alike. Nothing here uses --lf or --ff,
# so the cache buys nothing and costs a warning on every run, including the
# pre-commit gate, where output has to stay readable.
addopts = -q -p no:cacheprovider
